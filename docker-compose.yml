services:
  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_DATABASE: enterprise_hr
      MYSQL_USER: hr_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-hr_app_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_local}"]
      interval: 10s
      timeout: 5s
      retries: 12
